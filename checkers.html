<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checkers — You vs. Computer</title>
<style>
  :root{
    --bs: min(84vw, 470px);
    --light: #efd9b4;
    --dark: #9b6b4a;
    --gold: #ffd166;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; padding:26px 16px;
    display:flex; align-items:center; justify-content:center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#e9eef6;
    background: radial-gradient(1200px 620px at 50% -12%, #2a3549 0%, #121821 56%, #0a0d12 100%);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .app{ display:flex; flex-direction:column; gap:16px; align-items:center; width:100%; max-width:560px; }

  .topbar{ display:flex; align-items:baseline; justify-content:space-between; width:100%; gap:12px; }
  h1{ margin:0; font-size:.9rem; letter-spacing:.24em; text-transform:uppercase; font-weight:650; color:#b9c6d8; }
  .score{ font-size:.82rem; color:#8fa0b8; font-variant-numeric: tabular-nums; letter-spacing:.04em; }

  .frame{
    padding:14px; border-radius:20px;
    background: linear-gradient(160deg, #3f2d21, #191110 62%);
    box-shadow: 0 26px 54px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.09);
  }

  .board{
    position:relative; width:var(--bs); height:var(--bs);
    border-radius:9px; overflow:hidden; cursor:pointer; touch-action: manipulation;
  }
  .cells{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); }
  .cell.light{ background:var(--light); }
  .cell.dark{ background:var(--dark); }

  .piece{
    position:absolute; width:10.7%; height:10.7%; border-radius:50%;
    pointer-events:none; z-index:3;
    display:grid; place-items:center;
    transition: left .22s cubic-bezier(.4,0,.2,1), top .22s cubic-bezier(.4,0,.2,1),
                transform .18s ease, opacity .18s ease;
    box-shadow: 0 4px 8px rgba(0,0,0,.45), inset 0 -3px 7px rgba(0,0,0,.38), inset 0 3px 7px rgba(255,255,255,.26);
  }
  .piece.r{ background: radial-gradient(circle at 32% 27%, #f27d6c, #b5312a 72%); }
  .piece.b{ background: radial-gradient(circle at 32% 27%, #545c70, #1c212b 74%); }
  .piece::before{
    content:""; position:absolute; inset:14%; border-radius:50%;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14);
  }
  .piece.king::after{
    content:"\265A"; position:relative; z-index:2;
    font-size: calc(var(--bs) * .042); line-height:1;
    color: rgba(255,216,130,.96); text-shadow: 0 1px 2px rgba(0,0,0,.65);
  }
  .piece.sel{
    transform: scale(1.09);
    box-shadow: 0 0 0 3px var(--gold), 0 6px 12px rgba(0,0,0,.5), inset 0 -3px 7px rgba(0,0,0,.35);
  }
  .piece.must::before{
    inset:-9%; box-shadow: none;
    border:2px solid rgba(255,209,102,.6);
  }
  .piece.gone{ opacity:0; transform: scale(.25); }
  .piece.spawn{ animation: pop .3s ease-out; }
  @keyframes pop{ from{ transform: scale(.45); opacity:.2; } to{ transform: scale(1); opacity:1; } }

  .marker{
    position:absolute; z-index:2; border-radius:50%; pointer-events:none;
    animation: fade .15s ease-out;
  }
  .marker{ width:3.8%; height:3.8%; background: rgba(18,24,34,.34);
           box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.28); }
  .marker.cap{ width:4.8%; height:4.8%; background:#ff6b5a;
               box-shadow: 0 0 12px rgba(255,107,90,.85), inset 0 0 0 1.5px rgba(255,255,255,.4); }
  @keyframes fade{ from{ opacity:0; transform:scale(.6);} to{ opacity:1; transform:scale(1);} }

  .status{
    width:100%; text-align:center; font-size:.88rem; min-height:1.25rem;
    color:#cdd8e7; letter-spacing:.01em;
  }
  .controls{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; width:100%; }
  .sel-wrap{ display:flex; align-items:center; gap:6px; font-size:.78rem; color:#8fa0b8; letter-spacing:.08em; text-transform:uppercase; }
  select, button{
    font: inherit; font-size:.82rem; color:#e6edf7;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius:10px; padding:8px 12px; cursor:pointer;
    transition: background .15s ease, border-color .15s ease, transform .08s ease;
  }
  select{ padding:7px 8px; }
  button:hover, select:hover{ background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.24); }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity:.4; cursor:default; }
  button.primary{ background: linear-gradient(180deg,#ffd166,#e0a92f); color:#2a1f0a; border-color:#f0c25a; font-weight:650; }
  button.primary:hover{ background: linear-gradient(180deg,#ffdb85,#e9b53c); }
  .hint{ margin:0; font-size:.72rem; line-height:1.55; color:#7d8da3; text-align:center; max-width:44ch; }
  .hint b{ color:#a8b8cd; font-weight:600; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Checkers</h1>
    <div class="score" id="score">Red 12 · Black 12</div>
  </div>

  <div class="frame">
    <div class="board" id="board" aria-label="Checkers board"></div>
  </div>

  <div class="status" id="status">Your move — you play Red.</div>

  <div class="controls">
    <label class="sel-wrap">Level
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <button id="undo">Undo</button>
    <button id="newGame" class="primary">New game</button>
  </div>

  <p class="hint"><b>Men</b> move one square diagonally forward. <b>Captures are mandatory</b> and chain when possible. Reach the far row to be crowned a <b>king</b>, which moves and jumps in every direction.</p>
</div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Constants & state
   * ------------------------------------------------------------------ */
  var SQ = 12.5; // one square = 12.5% of the board

  var boardEl  = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var scoreEl  = document.getElementById('score');
  var diffEl   = document.getElementById('difficulty');
  var undoBtn  = document.getElementById('undo');
  var newBtn   = document.getElementById('newGame');

  var LEVELS = {
    easy:   { depth: 2, budget: 220,  random: 0.35 },
    medium: { depth: 4, budget: 650,  random: 0.05 },
    hard:   { depth: 7, budget: 1400, random: 0.0  }
  };

  var idSeq = 1;
  var board;            // 8x8 of null | {id, color:'r'|'b', king:bool}
  var side;             // whose turn: 'r' (human) or 'b' (computer)
  var pending = null;   // {candidates:[turns], prefix:[steps]} while a turn is in progress
  var selected = null;  // [row, col]
  var busy = false;
  var gameOver = false;
  var quiet = 0;        // turns without a capture or a man move
  var gen = 0;          // generation token: invalidates stale async work
  var difficulty = 'medium';
  var history = [];
  var pieceEls = new Map();

  /* ------------------------------------------------------------------ *
   *  Rules
   * ------------------------------------------------------------------ */
  function inB(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
  function other(col) { return col === 'r' ? 'b' : 'r'; }
  function makesKing(color, r) { return color === 'r' ? r === 0 : r === 7; }

  function dirsOf(p) {
    if (p.king) return [[-1, -1], [-1, 1], [1, -1], [1, 1]];
    return p.color === 'r' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];
  }

  function initialBoard() {
    var b = [], r, c, row;
    for (r = 0; r < 8; r++) {
      row = new Array(8).fill(null);
      for (c = 0; c < 8; c++) {
        if ((r + c) % 2 === 1) {
          if (r < 3)      row[c] = { id: idSeq++, color: 'b', king: false };
          else if (r > 4) row[c] = { id: idSeq++, color: 'r', king: false };
        }
      }
      b.push(row);
    }
    return b;
  }

  // Depth-first search for all maximal capture chains starting at (r,c).
  function collectChains(b, r, c, acc, out) {
    var p = b[r][c];
    var extended = false;
    var dirs = dirsOf(p);
    for (var i = 0; i < dirs.length; i++) {
      var dr = dirs[i][0], dc = dirs[i][1];
      var mr = r + dr, mc = c + dc, lr = r + 2 * dr, lc = c + 2 * dc;
      if (!inB(lr, lc)) continue;
      var mid = b[mr][mc];
      if (!mid || mid.color === p.color || b[lr][lc]) continue;

      extended = true;
      var man = !p.king;
      var wasKing = p.king;
      var promo = !p.king && makesKing(p.color, lr);

      p.king = p.king || promo;
      b[r][c] = null; b[mr][mc] = null; b[lr][lc] = p;

      var step = { from: [r, c], to: [lr, lc], cap: [mr, mc], man: man };
      var next = acc.concat([step]);

      // Crowning ends the turn in English draughts.
      if (promo) collectChainsPush(out, next);
      else collectChains(b, lr, lc, next, out);

      b[lr][lc] = null; b[mr][mc] = mid; b[r][c] = p; p.king = wasKing;
    }
    if (!extended && acc.length) out.push({ steps: acc });
  }
  function collectChainsPush(out, steps) { out.push({ steps: steps }); }

  function genTurns(b, color) {
    var jumps = [], r, c, p, i, dirs, dr, dc, nr, nc;

    for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) {
      p = b[r][c];
      if (p && p.color === color) collectChains(b, r, c, [], jumps);
    }
    if (jumps.length) return jumps;   // captures are mandatory

    var moves = [];
    for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) {
      p = b[r][c];
      if (!p || p.color !== color) continue;
      dirs = dirsOf(p);
      for (i = 0; i < dirs.length; i++) {
        dr = dirs[i][0]; dc = dirs[i][1];
        nr = r + dr; nc = c + dc;
        if (inB(nr, nc) && !b[nr][nc]) {
          moves.push({ steps: [{ from: [r, c], to: [nr, nc], cap: null, man: !p.king }] });
        }
      }
    }
    return moves;
  }

  // Pure application: returns a new board, never mutates existing piece objects.
  function applyTurn(b, turn) {
    var nb = b.map(function (row) { return row.slice(); });
    for (var i = 0; i < turn.steps.length; i++) {
      var s = turn.steps[i];
      var p = nb[s.from[0]][s.from[1]];
      if (!p) continue;
      if (s.cap) nb[s.cap[0]][s.cap[1]] = null;
      nb[s.from[0]][s.from[1]] = null;
      nb[s.to[0]][s.to[1]] = (!p.king && makesKing(p.color, s.to[0]))
        ? { id: p.id, color: p.color, king: true }
        : p;
    }
    return nb;
  }

  function turnIsQuiet(t) {
    return !t.steps.some(function (s) { return s.cap || s.man; });
  }

  /* ------------------------------------------------------------------ *
   *  Evaluation & search
   * ------------------------------------------------------------------ */
  function evaluate(b, color) {
    var score = 0, r, c, p, v, adv;
    for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) {
      p = b[r][c];
      if (!p) continue;
      if (p.king) {
        v = 175;
      } else {
        adv = p.color === 'r' ? (7 - r) : r;
        v = 100 + adv * 5;
        if (p.color === 'r' ? r === 7 : r === 0) v += 12; // keep the back row
      }
      if (c > 0 && c < 7) v += 3;       // central columns are more useful
      else v -= 2;                      // edges are easy to trap
      score += (p.color === color ? v : -v);
    }
    return score;
  }

  var nodes = 0, deadline = 0, aborted = false;

  function search(b, depth, alpha, beta, color) {
    if ((++nodes & 511) === 0 && performance.now() > deadline) aborted = true;
    if (aborted) return evaluate(b, color);

    var turns = genTurns(b, color);
    if (!turns.length) return -100000 - depth;   // no moves = loss, sooner is better
    if (depth <= 0) return evaluate(b, color);

    var best = -Infinity;
    for (var i = 0; i < turns.length; i++) {
      var sc = -search(applyTurn(b, turns[i]), depth - 1, -beta, -alpha, other(color));
      if (sc > best) best = sc;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  function chooseTurn(b, color, level) {
    var turns = genTurns(b, color);
    if (!turns.length) return null;
    if (turns.length === 1) return turns[0];

    var cfg = LEVELS[level] || LEVELS.medium;
    if (Math.random() < cfg.random) return turns[(Math.random() * turns.length) | 0];

    var best = turns[0];
    var t0 = performance.now();

    for (var d = 1; d <= cfg.depth; d++) {
      deadline = t0 + cfg.budget;
      aborted = false;
      nodes = 0;

      var bestScore = -Infinity, bestList = [], alpha = -Infinity;
      for (var i = 0; i < turns.length; i++) {
        var sc = -search(applyTurn(b, turns[i]), d - 1, -Infinity, -alpha, other(color));
        if (aborted) break;
        if (sc > bestScore + 1e-6) { bestScore = sc; bestList = [turns[i]]; }
        else if (sc >= bestScore - 1e-6) { bestList.push(turns[i]); }
        if (sc > alpha) alpha = sc;
      }

      if (!aborted && bestList.length) best = bestList[(Math.random() * bestList.length) | 0];
      if (aborted) break;
      if (Math.abs(bestScore) > 90000) break;   // forced win/loss found
    }
    return best;
  }

  /* ------------------------------------------------------------------ *
   *  Rendering
   * ------------------------------------------------------------------ */
  function buildCells() {
    var wrap = document.createElement('div');
    wrap.className = 'cells';
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var d = document.createElement('div');
      d.className = 'cell ' + (((r + c) % 2) ? 'dark' : 'light');
      wrap.appendChild(d);
    }
    boardEl.appendChild(wrap);
  }

  function place(el, r, c) {
    el.style.left = (c * SQ + 0.9) + '%';
    el.style.top  = (r * SQ + 0.9) + '%';
  }

  function renderMarkers() {
    var old = boardEl.querySelectorAll('.marker');
    for (var i = 0; i < old.length; i++) old[i].remove();
    if (!pending) return;

    var idx = pending.prefix.length;
    var seen = {};
    for (var k = 0; k < pending.candidates.length; k++) {
      var st = pending.candidates[k].steps[idx];
      if (!st) continue;
      var key = st.to[0] + ',' + st.to[1];
      if (seen[key]) continue;
      seen[key] = true;

      var isCap = !!st.cap;
      var size = isCap ? 4.8 : 3.8;
      var off = (SQ - size) / 2;
      var m = document.createElement('div');
      m.className = 'marker' + (isCap ? ' cap' : '');
      m.style.left = (st.to[1] * SQ + off) + '%';
      m.style.top  = (st.to[0] * SQ + off) + '%';
      boardEl.appendChild(m);
    }
  }

  function render() {
    var must = {};
    if (side === 'r' && !gameOver && !pending) {
      var turns = genTurns(board, 'r');
      if (turns.length && turns[0].steps[0].cap) {
        for (var t = 0; t < turns.length; t++) {
          must[turns[t].steps[0].from.join(',')] = true;
        }
      }
    }

    var present = {};
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var p = board[r][c];
      if (!p) continue;
      present[p.id] = true;

      var el = pieceEls.get(p.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'piece ' + p.color;
        el.style.transition = 'none';
        place(el, r, c);
        boardEl.appendChild(el);
        pieceEls.set(p.id, el);
        (function (node) {
          requestAnimationFrame(function () {
            node.style.transition = '';
            node.classList.add('spawn');
          });
        })(el);
      } else {
        place(el, r, c);
      }

      el.classList.toggle('king', !!p.king);
      el.classList.toggle('sel', !!selected && selected[0] === r && selected[1] === c);
      el.classList.toggle('must', !!must[r + ',' + c]);
    }

    pieceEls.forEach(function (el, id) {
      if (present[id]) return;
      pieceEls.delete(id);
      el.classList.add('gone');
      setTimeout(function () { el.remove(); }, 260);
    });

    renderMarkers();
    updateScore();
  }

  function updateScore() {
    var you = 0, comp = 0;
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var p = board[r][c];
      if (!p) continue;
      if (p.color === 'r') you++; else comp++;
    }
    scoreEl.textContent = 'Red ' + you + ' · Black ' + comp;
  }

  function setStatus(msg) { statusEl.textContent = msg; }

  /* ------------------------------------------------------------------ *
   *  Game flow
   * ------------------------------------------------------------------ */
  function newGame() {
    gen++;
    busy = false; gameOver = false; pending = null; selected = null;
    history = []; quiet = 0;
    board = initialBoard();
    side = 'r';
    pieceEls.forEach(function (el) { el.remove(); });
    pieceEls.clear();
    render();
    setStatus('Your move — you play Red.');
  }

  function checkEnd(color) {
    if (genTurns(board, color).length === 0) {
      gameOver = true;
      render();
      setStatus(color === 'r'
        ? 'Computer wins — you have no moves left.'
        : 'You win! The computer has no moves left.');
      return true;
    }
    if (quiet >= 40) {
      gameOver = true;
      render();
      setStatus('Draw — 40 moves without a capture or a man moving.');
      return true;
    }
    return false;
  }

  function finishHumanTurn(turn) {
    pending = null; selected = null;
    quiet = turnIsQuiet(turn) ? quiet + 1 : 0;
    side = 'b';
    render();
    if (checkEnd('b')) return;

    busy = true;
    setStatus('Computer is thinking…');
    var myGen = gen;
    setTimeout(function () { aiMove(myGen); }, 320);
  }

  var sleep = function (ms) { return new Promise(function (res) { setTimeout(res, ms); }); };

  async function aiMove(myGen) {
    if (myGen !== gen) return;
    history.push({ board: board, side: side, quiet: quiet });

    var turn = chooseTurn(board, 'b', difficulty);
    if (!turn || myGen !== gen) { busy = false; return; }

    for (var i = 0; i < turn.steps.length; i++) {
      if (myGen !== gen) return;
      board = applyTurn(board, { steps: [turn.steps[i]] });
      render();
      await sleep(300);
    }
    if (myGen !== gen) return;

    quiet = turnIsQuiet(turn) ? quiet + 1 : 0;
    side = 'r';
    busy = false;
    render();
    if (!checkEnd('r')) setStatus('Your move.');
  }

  /* ------------------------------------------------------------------ *
   *  Input
   * ------------------------------------------------------------------ */
  function advance(r, c) {
    var i = pending.prefix.length;
    var matching = pending.candidates.filter(function (t) {
      var s = t.steps[i];
      return s && s.to[0] === r && s.to[1] === c;
    });
    if (!matching.length) return;

    var step = matching[0].steps[i];
    if (i === 0) history.push({ board: board, side: side, quiet: quiet });

    board = applyTurn(board, { steps: [step] });
    var prefix = pending.prefix.concat([step]);
    var more = matching.some(function (t) { return t.steps.length > prefix.length; });
    selected = [step.to[0], step.to[1]];

    if (more) {
      pending = { candidates: matching, prefix: prefix };
      render();
      setStatus('Keep jumping!');
      return;
    }

    pending = null;
    finishHumanTurn({ steps: prefix });
  }

  boardEl.addEventListener('click', function (ev) {
    if (busy || gameOver || side !== 'r') return;

    var rect = boardEl.getBoundingClientRect();
    var c = Math.floor((ev.clientX - rect.left) / (rect.width / 8));
    var r = Math.floor((ev.clientY - rect.top) / (rect.height / 8));
    if (!inB(r, c)) return;

    if (pending) { advance(r, c); return; }

    var p = board[r][c];
    if (!p || p.color !== 'r') {
      selected = null; pending = null; render();
      return;
    }

    var all = genTurns(board, 'r');
    var forced = all.length > 0 && !!all[0].steps[0].cap;
    var turns = all.filter(function (t) {
      return t.steps[0].from[0] === r && t.steps[0].from[1] === c;
    });

    if (!turns.length) {
      selected = null; pending = null; render();
      setStatus(forced
        ? 'Captures are mandatory — pick a piece that can jump.'
        : 'That piece has no legal move.');
      return;
    }

    selected = [r, c];
    pending = { candidates: turns, prefix: [] };
    setStatus('Choose a highlighted square.');
    render();
  });

  undoBtn.addEventListener('click', function () {
    if (busy || !history.length) return;
    gen++;
    var snap = null;
    while (history.length) {
      snap = history.pop();
      if (snap.side === 'r') break;
    }
    if (!snap) return;
    board = snap.board; side = 'r'; quiet = snap.quiet;
    pending = null; selected = null; gameOver = false; busy = false;
    render();
    setStatus('Move undone.');
  });

  newBtn.addEventListener('click', newGame);
  diffEl.addEventListener('change', function () {
    difficulty = diffEl.value;
    setStatus('Level set to ' + diffEl.options[diffEl.selectedIndex].text + '.');
  });

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */
  buildCells();
  newGame();
})();
</script>
</body>
</html>
